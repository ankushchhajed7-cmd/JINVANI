<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>जिनवाणी प्रश्नोत्तरी</title>

<!-- ===== PWA (install on mobile) ===== -->
<link rel="manifest" href="./manifest.json">
<meta name="theme-color" content="#7a1f2b">
<meta name="description" content="जैन कथा-साहित्य एवं तीर्थंकर-चरित्र पर आधारित प्रश्नोत्तरी">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="जिनवाणी">
<link rel="icon" type="image/png" sizes="32x32" href="./favicon-32.png">
<link rel="icon" type="image/png" sizes="192x192" href="./icon-192.png">
<link rel="apple-touch-icon" href="./apple-touch-icon.png">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Yatra+One&family=Mukta:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --parchment:#f3e6c9;
    --parchment-deep:#ead6ab;
    --ink:#2c1810;
    --maroon:#7a1f2b;
    --maroon-deep:#5c1620;
    --gold:#b8860b;
    --gold-light:#dcae3a;
    --sage:#4b6b4f;
    --rust:#a4392f;
    --shadow: 0 10px 30px rgba(44,24,16,0.18);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    font-family:'Mukta', sans-serif;
    background:
      radial-gradient(circle at 15% 10%, rgba(184,134,11,0.10), transparent 40%),
      radial-gradient(circle at 85% 90%, rgba(122,31,43,0.10), transparent 45%),
      var(--parchment);
    color:var(--ink);
    min-height:100vh;
    -webkit-font-smoothing:antialiased;
  }
  .wrap{
    max-width:640px;
    margin:0 auto;
    padding:20px 18px 60px;
    min-height:100vh;
  }
  header.site{
    text-align:center;
    padding:22px 0 18px;
    border-bottom:2px solid rgba(122,31,43,0.25);
    margin-bottom:24px;
    position:relative;
  }
  /* ---------- Brand logo (gold + silver mirror) ---------- */
  .brand-logo{
    width:96px;
    height:96px;
    display:block;
    margin:0 auto 8px;
    border-radius:50%;
    filter:drop-shadow(0 6px 16px rgba(44,24,16,0.35));
  }
  /* ---------- Install button ---------- */
  #install-btn{
    display:none;
    margin:14px auto 0;
    padding:11px 22px;
    border:none;
    border-radius:999px;
    font-family:'Mukta',sans-serif;
    font-size:15px;
    font-weight:700;
    color:#3a2405;
    cursor:pointer;
    background:linear-gradient(100deg,
      #6a4708 0%, #a8760c 10%, #f0d179 20%, #fff8dc 28%,
      #e3bb45 36%, #8f6208 46%, #d8ae37 55%, #fff3c4 64%,
      #c9971d 72%, #7a5408 82%, #e8c766 91%, #5c3d05 100%);
    box-shadow:0 4px 14px rgba(44,24,16,0.28), inset 0 1px 0 rgba(255,255,255,0.55);
  }
  #install-btn:active{transform:translateY(1px);}
  #install-btn.show{display:block;}

  header.site .eyebrow{
    font-size:12px;
    letter-spacing:0.14em;
    color:var(--maroon);
    text-transform:uppercase;
    font-weight:600;
  }
  header.site h1{
    font-family:'Yatra One', cursive;
    font-size:34px;
    margin:6px 0 4px;
    color:var(--maroon-deep);
    letter-spacing:0.5px;
  }
  header.site p.sub{
    margin:0;
    font-size:14.5px;
    color:#5a4633;
  }

  /* ---------- Chapter cards ---------- */
  .chapter-grid{
    display:grid;
    grid-template-columns:1fr;
    gap:16px;
  }
  .chapter-card{
    background:linear-gradient(180deg, #fbf3de, var(--parchment-deep));
    border:1px solid rgba(122,31,43,0.22);
    border-radius:14px;
    padding:18px 18px 16px;
    box-shadow:var(--shadow);
    position:relative;
    overflow:hidden;
    cursor:pointer;
    transition:transform .18s ease, box-shadow .18s ease;
  }
  .chapter-card:hover{ transform:translateY(-2px); }
  .chapter-card:active{ transform:translateY(0px) scale(0.995); }
  .chapter-card::before{
    content:"";
    position:absolute; top:0; left:0; bottom:0;
    width:6px;
    background:var(--maroon);
  }
  .chapter-card .num{
    font-family:'Yatra One', cursive;
    font-size:13px;
    color:var(--gold);
    letter-spacing:0.12em;
  }
  .chapter-card h2{
    font-family:'Yatra One', cursive;
    font-size:22px;
    margin:4px 0 6px;
    color:var(--maroon-deep);
  }
  .chapter-card p{
    margin:0 0 10px;
    font-size:14.5px;
    color:#5a4633;
    line-height:1.5;
  }
  .chapter-meta{
    display:flex;
    align-items:center;
    justify-content:space-between;
    font-size:13px;
    color:var(--maroon);
    font-weight:600;
  }
  .chapter-meta .go{
    background:var(--maroon);
    color:var(--parchment);
    padding:6px 14px;
    border-radius:999px;
    font-size:13px;
    font-weight:600;
  }
  .partial-tag{
    display:inline-block;
    margin-top:8px;
    font-size:12px;
    background:rgba(164,57,47,0.14);
    color:var(--rust);
    padding:3px 9px;
    border-radius:6px;
    font-weight:600;
  }

  footer.note{
    margin-top:26px;
    text-align:center;
    font-size:12.5px;
    color:#7a6a52;
    line-height:1.6;
  }

  /* ---------- Quiz screen ---------- */
  .quiz-header{
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin-bottom:6px;
  }
  .back-btn{
    background:none;
    border:none;
    color:var(--maroon);
    font-family:'Mukta',sans-serif;
    font-size:14px;
    font-weight:600;
    cursor:pointer;
    padding:6px 0;
  }
  .score-pill{
    background:var(--maroon-deep);
    color:var(--parchment);
    font-size:13px;
    font-weight:600;
    padding:5px 12px;
    border-radius:999px;
  }
  .progress-track{
    width:100%;
    height:6px;
    background:rgba(122,31,43,0.15);
    border-radius:4px;
    margin:10px 0 20px;
    overflow:hidden;
  }
  .progress-fill{
    height:100%;
    background:linear-gradient(90deg, var(--gold), var(--maroon));
    border-radius:4px;
    transition:width .35s ease;
  }
  .chapter-title-small{
    font-family:'Yatra One', cursive;
    font-size:19px;
    color:var(--maroon-deep);
    margin:0 0 2px;
  }
  .q-count{
    font-size:13px;
    color:#7a6a52;
    margin-bottom:14px;
  }
  .question-card{
    background:#fffaf0;
    border:1px solid rgba(122,31,43,0.2);
    border-radius:14px;
    padding:20px 18px;
    box-shadow:var(--shadow);
  }
  .question-text{
    font-size:18px;
    font-weight:600;
    line-height:1.55;
    margin:0 0 16px;
    color:var(--ink);
  }
  .options{
    display:flex;
    flex-direction:column;
    gap:10px;
  }
  .option{
    text-align:right;
    direction:rtl;
    background:var(--parchment);
    border:1.5px solid rgba(122,31,43,0.3);
    border-radius:10px;
    padding:12px 14px;
    font-size:15.5px;
    font-family:'Mukta',sans-serif;
    color:var(--ink);
    cursor:pointer;
    line-height:1.5;
    transition:background .15s ease, border-color .15s ease, transform .1s ease;
  }
  .option:active{ transform:scale(0.99); }
  .option.correct{
    background:rgba(75,107,79,0.18);
    border-color:var(--sage);
    color:#2f4a33;
    font-weight:700;
  }
  .option.wrong{
    background:rgba(164,57,47,0.15);
    border-color:var(--rust);
    color:#6b241c;
    font-weight:700;
  }
  .option.disabled{ pointer-events:none; opacity:0.85; }

  .explain{
    margin-top:14px;
    padding:12px 14px;
    border-radius:10px;
    background:rgba(184,134,11,0.12);
    border-right:4px solid var(--gold);
    font-size:14px;
    line-height:1.6;
    color:#4a3a1e;
    display:none;
  }
  .explain.show{ display:block; }

  .next-btn{
    margin-top:16px;
    width:100%;
    padding:13px;
    border:none;
    border-radius:10px;
    background:var(--maroon);
    color:var(--parchment);
    font-family:'Mukta',sans-serif;
    font-size:16px;
    font-weight:700;
    cursor:pointer;
    display:none;
  }
  .next-btn.show{ display:block; }
  .next-btn:active{ background:var(--maroon-deep); }

  /* ---------- Result screen ---------- */
  .result-wrap{ text-align:center; padding-top:10px; }
  .lotus-holder{ margin:10px auto 8px; width:180px; height:180px; }
  .result-title{
    font-family:'Yatra One', cursive;
    font-size:26px;
    color:var(--maroon-deep);
    margin:6px 0 4px;
  }
  .result-score{
    font-size:17px;
    color:#5a4633;
    margin-bottom:4px;
  }
  .result-msg{
    font-size:14.5px;
    color:#6b5b42;
    max-width:400px;
    margin:0 auto 22px;
    line-height:1.6;
  }
  .result-actions{
    display:flex;
    gap:12px;
    justify-content:center;
    flex-wrap:wrap;
  }
  .btn{
    padding:11px 20px;
    border-radius:999px;
    border:1.5px solid var(--maroon);
    background:transparent;
    color:var(--maroon);
    font-family:'Mukta',sans-serif;
    font-weight:700;
    font-size:14.5px;
    cursor:pointer;
  }
  .btn.primary{
    background:var(--maroon);
    color:var(--parchment);
  }

  .petal{ transition: fill 0.5s ease, opacity 0.5s ease; }

  @media (prefers-reduced-motion: reduce){
    .chapter-card, .option, .progress-fill, .petal{ transition:none !important; }
  }

  /* ---------- Listen (सुनें) mode ---------- */
  .listen-btn{
    display:block;
    width:100%;
    margin-top:10px;
    padding:9px 14px;
    border-radius:999px;
    border:1.5px solid var(--maroon);
    background:transparent;
    color:var(--maroon);
    font-family:'Mukta',sans-serif;
    font-weight:700;
    font-size:13.5px;
    cursor:pointer;
  }
  .listen-btn:active{ background:rgba(122,31,43,0.10); }

  .listen-controls{
    position:sticky;
    top:0;
    z-index:5;
    display:flex;
    gap:8px;
    align-items:center;
    justify-content:center;
    padding:10px 8px;
    margin:12px 0 10px;
    background:linear-gradient(180deg,#fbf3de,var(--parchment-deep));
    border:1px solid rgba(122,31,43,0.22);
    border-radius:14px;
    box-shadow:var(--shadow);
  }
  .lc-btn{
    border:1.5px solid var(--maroon);
    background:transparent;
    color:var(--maroon);
    font-family:'Mukta',sans-serif;
    font-weight:700;
    font-size:15px;
    padding:8px 14px;
    border-radius:999px;
    cursor:pointer;
    line-height:1.2;
  }
  .lc-btn.main{ background:var(--maroon); color:var(--parchment); min-width:104px; }
  .lc-btn.lc-rate{ font-size:13px; padding:8px 11px; }
  .lc-btn:disabled{ opacity:0.4; }
  .lc-status{
    text-align:center;
    font-size:13px;
    color:#5a4633;
    margin:0 0 14px;
    font-weight:600;
  }
  .qa-item{
    background:linear-gradient(180deg,#fbf3de,var(--parchment-deep));
    border:1px solid rgba(122,31,43,0.18);
    border-left:5px solid rgba(122,31,43,0.22);
    border-radius:12px;
    padding:14px 14px 12px;
    margin-bottom:12px;
    cursor:pointer;
    transition:box-shadow .2s ease, border-color .2s ease, background .2s ease;
  }
  .qa-item.active{
    border-left-color:var(--gold);
    box-shadow:0 6px 18px rgba(184,134,11,0.30);
    background:linear-gradient(180deg,#fff8e6,#f6e7bf);
  }
  .qa-item .qa-num{
    font-family:'Yatra One',cursive;
    font-size:12px;
    color:var(--gold);
    letter-spacing:0.10em;
  }
  .qa-item .qa-q{
    font-size:15.5px;
    font-weight:600;
    color:var(--ink);
    margin:4px 0 8px;
    line-height:1.55;
  }
  .qa-item .qa-a{
    font-size:15px;
    color:var(--sage);
    font-weight:700;
    line-height:1.55;
  }
  .qa-item .qa-e{
    font-size:13.5px;
    color:#5a4633;
    margin-top:8px;
    line-height:1.55;
    border-top:1px dashed rgba(122,31,43,0.22);
    padding-top:8px;
  }

  .hidden{ display:none !important; }
  .book-title-heading{
    font-family:'Yatra One', cursive;
    font-size:22px;
    color:var(--maroon-deep);
    margin:14px 0 14px;
  }
  .empty-book-msg{
    text-align:center;
    padding:40px 20px;
    color:#7a6a52;
    font-size:15px;
    background:#fbf3de;
    border-radius:14px;
    border:1px solid rgba(122,31,43,0.15);
  }
</style>
</head>
<body>

<div class="wrap">

  <header class="site">
    <img class="brand-logo" src="./icon-512.png" alt="भगवान महावीर स्वामी" width="96" height="96">
    <div class="eyebrow">जैन कथा-साहित्य</div>
    <h1>जिनवाणी प्रश्नोत्तरी</h1>
    <p class="sub">तीर्थंकर-चरित्र एवं सम्यक्त्व कथाओं पर आधारित प्रश्नोत्तरी</p>
    <button id="install-btn" type="button">📲 ऐप इंस्टॉल करें</button>
  </header>

  <!-- BOOK SCREEN -->
  <div id="book-screen">
    <div class="chapter-grid" id="book-grid"></div>
    <footer class="note">
      हर पुस्तक में उसके अध्यायों की कथा पर आधारित प्रश्नोत्तरी है। नई पुस्तकें और अध्याय समय-समय पर जुड़ते रहेंगे।
    </footer>
  </div>

  <!-- HOME SCREEN (chapter list within a book) -->
  <div id="home-screen" class="hidden">
    <button class="back-btn" id="back-to-books-btn">← पुस्तक सूची</button>
    <h2 class="book-title-heading" id="book-title-heading"></h2>
    <div class="chapter-grid" id="chapter-grid"></div>
    <footer class="note" id="home-footer-note"></footer>
  </div>

  <!-- LISTEN SCREEN -->
  <div id="listen-screen" class="hidden">
    <button class="back-btn" id="listen-back-btn">← अध्याय सूची</button>
    <div class="chapter-title-small" id="listen-chapter-title"></div>
    <div class="q-count" id="listen-count-text"></div>

    <div class="listen-controls">
      <button class="lc-btn" id="lc-prev" title="पिछला">⏮</button>
      <button class="lc-btn main" id="lc-play">▶ सुनें</button>
      <button class="lc-btn" id="lc-next" title="अगला">⏭</button>
      <button class="lc-btn" id="lc-stop" title="रोकें">■</button>
      <button class="lc-btn lc-rate" id="lc-rate" title="गति">1x</button>
    </div>
    <div class="lc-status" id="lc-status"></div>

    <div id="qa-list"></div>
  </div>

  <!-- QUIZ SCREEN -->

  <div id="quiz-screen" class="hidden">
    <div class="quiz-header">
      <button class="back-btn" id="back-btn">← अध्याय सूची</button>
      <span class="score-pill" id="score-pill">स्कोर: 0</span>
    </div>
    <div class="chapter-title-small" id="quiz-chapter-title"></div>
    <div class="q-count" id="quiz-progress-text"></div>
    <div class="progress-track"><div class="progress-fill" id="progress-fill" style="width:0%"></div></div>

    <div class="question-card">
      <p class="question-text" id="question-text"></p>
      <div class="options" id="options-holder"></div>
      <div class="explain" id="explain-box"></div>
      <button class="next-btn" id="next-btn">अगला प्रश्न →</button>
    </div>
  </div>

  <!-- RESULT SCREEN -->
  <div id="result-screen" class="hidden">
    <div class="result-wrap">
      <div class="lotus-holder">
        <svg viewBox="0 0 100 100" width="180" height="180" id="lotus-svg">
          <!-- 8 petals around center, drawn via JS-friendly groups -->
          <g id="petal-group"></g>
          <circle cx="50" cy="50" r="9" fill="#b8860b"/>
        </svg>
      </div>
      <div class="result-title" id="result-title"></div>
      <div class="result-score" id="result-score"></div>
      <p class="result-msg" id="result-msg"></p>
      <div class="result-actions">
        <button class="btn primary" id="retry-btn">इसी अध्याय को दोबारा करें</button>
        <button class="btn" id="home-btn">अन्य अध्याय चुनें</button>
      </div>
    </div>
  </div>

</div>

<script>
/* ============ DATA ============ */
const books = [
  {
    id:1,
    title:"Book 1",
    subtitle:"भगवान ऋषभदेव — जैन इतिहास के प्रारंभ के प्रसंग",
    chapters:[
      {
        id:1,
        title:"प्रथम तीर्थंकर का प्रथम भव",
        subtitle:"धन्ना सार्थवाह और आचार्य धर्मघोष की कथा",
        desc:"भगवान ऋषभदेव के जीव के धन्ना सार्थवाह के रूप में प्रथम भव और सम्यग्दर्शन प्राप्ति की कथा।",
        partial:false,
        questions:[
          {q:"भगवान ऋषभदेव का जीव किसी भव में महाविदेह के किस नगर में सार्थवाह के रूप में उत्पन्न हुआ?", o:["वसंतपुर","क्षितिप्रतिष्ठ नगर","विनीता नगरी","पुरिमताल नगर"], a:1, e:"भगवान ऋषभदेव का जीव महाविदेह के क्षितिप्रतिष्ठ नगर में धन्ना नामक सार्थवाह के रूप में उत्पन्न हुआ।"},
          {q:"उस भव में उनका नाम और पेशा क्या था?", o:["धन्ना नामक सार्थवाह (व्यापारी)","सुविधि नामक वैद्य","जीवानन्द नामक राजपुत्र","वज्रसेन नामक राजा"], a:0, e:"उस भव में वे धन्ना नामक सार्थवाह (व्यापारी) थे, जिनके पास विपुल सम्पदा थी।"},

      {q:"हाथी को वश में करने के बाद श्रेष्ठी धनावह ने प्रसन्न होकर अपनी किस पुत्री का विवाह ब्रह्मदत्त से किया?", o:["श्रीमती का","पुष्पमती का","नंदा का","कटकवती का"], a:1, e:"मगध नरेश की उपस्थिति में धनावह ने ब्रह्मदत्त का परिचय पाकर अपनी पुत्री पुष्पमती का विवाह उससे कर दिया।"},
      {q:"मगध नरेश के मंत्री सुबुद्धि ने अपनी पुत्री नंदा का विवाह किससे करवाया?", o:["ब्रह्मदत्त से","वरधनु से","सागरदत्त से","बुद्धिल से"], a:1, e:"मगध नरेश के मंत्री सुबुद्धि ने वरधनु को अपना जामाता बनाकर अपनी पुत्री नंदा उसे सौंप दी।"},
      {q:"राजगृह में यश कमाने के बाद ब्रह्मदत्त वरधनु के साथ किस उद्देश्य से वाराणसी गया?", o:["तीर्थयात्रा हेतु","पांचाल राज्य को दीर्घ से पुनः प्राप्त करने की तैयारी हेतु","व्यापार हेतु","विवाह हेतु"], a:1, e:"ब्रह्मदत्त ने वरधनु के साथ वाराणसी की ओर प्रस्थान किया ताकि पांचाल राज्य को दीर्घ के हाथों से पुनः प्राप्त करने की तैयारी की जा सके।"},
      {q:"वाराणसी नरेश ने ब्रह्मदत्त से अपनी किस पुत्री का विवाह करवाया और दहेज में क्या दिया?", o:["पुष्पमती, स्वर्ण मुद्राएँ","कटकवती, चतुरंगिणी सेना","नंदा, हाथी","श्रीमती, रथ"], a:1, e:"वाराणसी नरेश ने अपनी पुत्री कटकवती का विवाह ब्रह्मदत्त से किया और साथ में अपनी चतुरंगिणी सेना दहेज में दी।"},
      {q:"सभी मित्र राजाओं की सेनाएँ एकत्र कर ब्रह्मदत्त ने किसे सेनापति नियुक्त किया?", o:["धनु को","वरधनु को","सागरदत्त को","बुद्धिल को"], a:1, e:"सभी सेनाओं को एकत्रित कर ब्रह्मदत्त ने वरधनु को सेनापति नियुक्त किया और दीर्घ पर आक्रमण के लिए काम्पिल्यपुर की ओर प्रयाण किया।"},
      {q:"आक्रमण की सूचना पाकर दीर्घ ने वाराणसी नरेश को क्या संदेश भिजवाया?", o:["युद्ध की चुनौती","मित्रता न तोड़ने का अनुरोध","संधि का प्रस्ताव","धन देने का प्रस्ताव"], a:1, e:"दीर्घ ने वाराणसी नरेश के पास संदेश भिजवाया कि वे उसके साथ अपनी मित्रता न तोड़ें।"},
      {q:"वाराणसी नरेश ने दीर्घ के अनुरोध पर क्या उत्तर भेजा?", o:["मित्रता बनाए रखने का वादा किया","दीर्घ ने विश्वासघात किया है, यह अक्षम्य अपराध है, राज्य ब्रह्मदत्त को वापस दे दो","तटस्थ रहने का निर्णय बताया","दीर्घ का साथ देने की बात कही"], a:1, e:"वाराणसी नरेश ने कहलाया कि दीर्घ ने भ्राता-समान मित्र के साथ विश्वासघात किया है, यह अक्षम्य अपराध है, अतः राज्य ब्रह्मदत्त को वापस दे दे।"},
      {q:"दीर्घ और ब्रह्मदत्त के बीच लम्बे द्वंद्व युद्ध के बाद क्या परिणाम निकला, इसके तुरंत बाद आकाश में क्या प्रकट हुआ?", o:["ब्रह्मदत्त हार गया","जय-पराजय का निर्णय न होने पर दिव्य चक्ररत्न प्रकट हुआ","दीर्घ भाग गया","संधि हो गई"], a:1, e:"लम्बे युद्ध के बाद भी निर्णय न होने पर आकाश में गंभीर गर्जन के साथ एक दिव्य चक्ररत्न प्रकट हुआ, जिसने ब्रह्मदत्त की तीन बार परिक्रमा की।"},
      {q:"ब्रह्मदत्त ने चक्ररत्न से दीर्घ का वध कैसे किया?", o:["तलवार से काटकर","चक्र को तर्जनी पर धारण कर वेग से घुमाकर दीर्घ की ओर फेंका","बाण से बींधकर","गदा से प्रहार कर"], a:1, e:"ब्रह्मदत्त ने दाहिने हाथ की तर्जनी पर चक्र धारण किया और वेग से घुमाकर दीर्घ की ओर फेंका, जिससे क्षणभर में उसका मस्तक धड़ से अलग हो गया।"},
      {q:"ब्रह्मदत्त के नगर-प्रवेश से पहले चुलनी ने क्या किया?", o:["आत्महत्या कर ली","पश्चाताप कर धर्म-मार्ग में प्रव्रजित होकर अन्यत्र प्रस्थान कर गई","राज्य पर कब्जा करने की कोशिश की","भाग गई"], a:1, e:"चुलनी ने देर से ही सही अपनी पतित करनी का अनुभव किया और धर्म-मार्ग में प्रव्रजित होकर ब्रह्मदत्त के नगर-प्रवेश से पूर्व ही अन्यत्र प्रस्थान कर गई।"},
      {q:"राजसिंहासन पर बैठते ही ब्रह्मदत्त ने सबसे पहले क्या किया?", o:["युद्ध की घोषणा की","अपनी नवों पत्नियों को पितृगृहों से राजमहल में बुलवाया","मंदिर बनवाया","सेना भंग कर दी"], a:1, e:"काम्पिल्यपुर के राजसिंहासन पर बैठते ही उसने अपनी नवों पत्नियों को उनके पितृगृहों से अपने राजमहल में बुलवा लिया।"},
      {q:"ब्रह्मदत्त ने कितने वर्षों तक माण्डलिक राजा के रूप में राज्य-संचालन किया, फिर विश्व-विजय के लिए प्रयाण किया?", o:["चालीस वर्ष","छप्पन वर्ष","सत्तर वर्ष","सौ वर्ष"], a:1, e:"उन्होंने छप्पन वर्षों तक माण्डलिक राजा के रूप में राज्य-संचालन किया, उसके बाद षट्खण्ड विजय के लिए प्रयाण किया।"},
      {q:"षट्खण्ड विजय में ब्रह्मदत्त को कितने वर्ष लगे?", o:["आठ वर्ष","सोलह वर्ष","बत्तीस वर्ष","पचास वर्ष"], a:1, e:"सोलह वर्षों तक अनेक युद्धों और भीषण संघर्षों के बाद समस्त भारतखण्ड पर विजय पाकर वे काम्पिल्यपुर लौटे।"},
      {q:"विजय के बाद ब्रह्मदत्त किन-किन समृद्धियों का स्वामी बना?", o:["केवल सेना का","चौदह रत्नों, नवनिधियों और चक्रवर्ती सम्राट की सभी समृद्धियों का","केवल धन का","केवल भूमि का"], a:1, e:"ब्रह्मदत्त चौदह रत्नों, नवनिधियों और चक्रवर्ती सम्राट की सभी समृद्धियों का स्वामी बना।"},
      {q:"ब्रह्मदत्त को जातिस्मरण ज्ञान किस वस्तु को देखकर हुआ?", o:["एक स्वप्न में","एक कलात्मक पुष्प-स्तवक (गुच्छा) को देखकर","एक मुनि के प्रवचन से","एक युद्ध के बाद"], a:1, e:"दासी द्वारा लाए गए पशु-पक्षी आकृतियों वाले कलात्मक पुष्प-स्तवक को देखते हुए एकाग्र चिंतन से ब्रह्मदत्त को जातिस्मरण ज्ञान हुआ।"},
      {q:"जातिस्मरण ज्ञान से ब्रह्मदत्त को क्या दिखने लगा?", o:["भविष्य के भव","अपने पूर्व के पाँच भव","केवल पिछला जन्म","देवलोक का दृश्य"], a:1, e:"जातिस्मरण ज्ञान होने पर ब्रह्मदत्त को अपने पूर्व के पाँच भव यथावत् दिखने लगे और वह मूर्च्छित होकर गिर पड़ा।"},
      {q:"अपने सगे भाई (पूर्वजन्मों के) को खोजने के लिए ब्रह्मदत्त ने क्या घोषणा की?", o:["सेना भेजकर खोजने की","जो गाथा के चतुर्थ पद (शेष पंक्तियों) की पूर्ति करेगा उसे आधा राज्य मिलेगा","धन इनाम देने की","किसी को नहीं खोजने की"], a:1, e:"ब्रह्मदत्त ने घोषणा करवाई कि जो व्यक्ति गाथाद्वय के शेष पद की पूर्ति कर देगा, उसे वह अपना आधा राज्य दे देगा।"},
      {q:"गाथा की शेष पंक्तियाँ किस तपस्वी मुनि ने पूरी कीं?", o:["चित्त मुनि ने","संभूत मुनि ने","धर्मघोष मुनि ने","अरिदमन मुनि ने"], a:0, e:"चित्त नामक महान तपस्वी श्रमण ने माली के मुख से गाथा सुनकर स्वयं को भी जातिस्मरण ज्ञान होने पर शेष पंक्तियाँ पूरी कीं।"},
      {q:"चित्त मुनि को गाथा की जानकारी कैसे मिली?", o:["स्वप्न में","उद्यान के माली के गुनगुनाने से सुनकर","किसी शास्त्र से","राजा से पूछकर"], a:1, e:"बाग का माली पौधों में पानी देते हुए गाथा की पंक्तियाँ गुनगुना रहा था, जिसे सुनकर चित्त मुनि को भी जातिस्मरण ज्ञान हो गया।"},
      {q:"माली ने ब्रह्मदत्त को पूरी गाथा सुनाई तो ब्रह्मदत्त पर क्या प्रभाव हुआ, और उसने माली को क्या पुरस्कार दिया?", o:["क्रोधित हुआ, दंड दिया","मूर्च्छित हो गया, मुकुट के अतिरिक्त सभी आभूषण दिए","कुछ नहीं हुआ","हँसने लगा"], a:1, e:"पंक्तियाँ सुनते ही ब्रह्मदत्त मूर्च्छित हो गया, बाद में प्रसन्न होकर माली को मुकुट के अतिरिक्त सभी आभूषण उपहार में दिए।"},
      {q:"मुनि चित्त और ब्रह्मदत्त के बीच पिछले कितने भवों में सगे भाई का संबंध था?", o:["तीन भव","पाँच भव","सात भव","दस भव"], a:1, e:"चित्त मुनि ने बताया कि वे दोनों पिछले पाँच भवों में सगे भाई रहे थे।"},
      {q:"पहले भव में दोनों भाई किसकी दासी के गर्भ से दास के रूप में उत्पन्न हुए थे?", o:["शांडिल्यायन ब्राह्मण की दासी जसमती के गर्भ से","किसी राजा के यहाँ","किसी व्यापारी के यहाँ","किसी मुनि के यहाँ"], a:0, e:"पहले भव में वे श्रीदह ग्राम में शांडिल्यायन ब्राह्मण की दासी जसमती के गर्भ से दास रूप में उत्पन्न हुए थे।"},
      {q:"दास रूप में दोनों भाइयों की मृत्यु कैसे हुई?", o:["भूख से","वट वृक्ष के कोटर में एक विषधर (साँप) के काटने से","युद्ध में","बीमारी से"], a:1, e:"वर्षा में वट वृक्ष के कोटर में रात बिताते समय एक विषधर ने दोनों को काट लिया और दोनों काल के ग्रास हो गए।"},
      {q:"दूसरे भव में दोनों भाई कहाँ हरिण-युगल के रूप में जन्मे और कैसे मरे?", o:["कालिंजर पर्वत पर, व्याघ्र के बाण से","विंध्य पर्वत पर, शेर से","हिमालय पर, बाढ़ से","अरावली पर, भूख से"], a:0, e:"वे कालिंजर पर्वत पर हरिणी के गर्भ से हरिण-युगल बने, और वेगवती नदी तट पर एक व्याघ्र के एक ही बाण से दोनों की मृत्यु हो गई।"},
      {q:"तीसरे भव में दोनों भाई किस रूप में और कैसे मरे?", o:["हंसों के रूप में, पारधी के जाल में गरदन मरोड़े जाने से","मछली के रूप में, जाल में फँसकर","बत्तख के रूप में, शिकारी के बाण से","कोई भव नहीं था"], a:0, e:"वे मयंग नदी के सरोवर में हंसिनी के पेट से हंसों के रूप में जन्मे और एक पारधी के जाल में फँसकर गरदन मरोड़े जाने से मरे।"},
      {q:"चौथे भव में दोनों भाई काशी के चाण्डाल भूतदीन की पत्नी अन्निका के गर्भ से किन नामों से जुड़वाँ जन्मे?", o:["चित्र और संभूत","ब्रह्मदत्त और वरधनु","सागरदत्त और बुद्धिल","नमूची और धनु"], a:0, e:"वे चाण्डाल दंपति के यहाँ जुड़वाँ भाइयों के रूप में जन्मे — बड़े का नाम चित्र और छोटे का नाम संभूत रखा गया।"},
      {q:"काशीनरेश अमितवाहन ने मृत्युदंड-प्राप्त पुरोहित नमूची को किसे सौंपा था?", o:["चित्र-संभूत के पिता को","किसी सेनापति को","किसी मंत्री को","स्वयं रखा"], a:0, e:"अमितवाहन ने अपराधी पुरोहित नमूची को चित्र-संभूत के पिता (चाण्डाल भूतदीन) को सौंप दिया था।"},
      {q:"पिता ने नमूची से क्या शर्त रखी, जिसके बदले उसे सुरक्षित रखने का वादा किया?", o:["धन देने की","दोनों पुत्रों को सभी कलाओं में निपुण करने की","खेत में काम करने की","कुछ नहीं"], a:1, e:"पिता ने नमूची से कहा कि यदि वह दोनों पुत्रों को सारी कलाओं में निपुण कर दे तो उसे सुरक्षित रखा जाएगा।"},
      {q:"नमूची और चित्र-संभूत की माता के बीच क्या संबंध बन गया?", o:["शत्रुता","दोनों एक-दूसरे पर आसक्त हो गए","कोई संबंध नहीं","मित्रता मात्र"], a:1, e:"कुछ ही समय में पुरोहित नमूची और उनकी माता दोनों एक-दूसरे पर आसक्त हो गए थे।"},
      {q:"पिता को नमूची-माता के संबंध का पता चलने पर चित्र-संभूत ने क्या किया?", o:["नमूची को राजा को सौंप दिया","नमूची को चुपके से घर से भगा दिया","कुछ नहीं किया","नमूची को मार डाला"], a:1, e:"पिता के नमूची को मार डालने के निश्चय की जानकारी मिलने पर चित्र-संभूत ने नमूची को चुपके से भगा दिया।"},
      {q:"भगा हुआ नमूची कहाँ जाकर किसका मंत्री बना?", o:["हस्तिनापुर में सनत्कुमार चक्रवर्ती का मंत्री","वाराणसी में दीर्घ का मंत्री","राजगृह में मगधनरेश का मंत्री","कौशाम्बी में राजा का मंत्री"], a:0, e:"नमूची हस्तिनापुर पहुँचकर सनत्कुमार चक्रवर्ती के यहाँ मंत्री बन गया।"},
      {q:"वाराणसी में चित्र-संभूत के नगर-प्रवेश पर प्रतिबंध क्यों लगाया गया?", o:["वे चोर थे","उनके गायन से रमणियाँ मंत्रमुग्ध होकर पीछे दौड़ पड़ती थीं","वे विदेशी थे","वे बीमार थे"], a:1, e:"उनके गायन के आकर्षण से पुर-जन विशेषतः रमणियाँ सब कुछ भूलकर मंत्रमुग्ध-सी दौड़ी चली आती थीं, इसलिए प्रमुख नागरिकों ने नगर-प्रवेश पर प्रतिबंध लगवा दिया।"},
      {q:"कौमुदी-महोत्सव में पहचाने जाकर पिटते हुए भागने के बाद दोनों भाइयों ने क्या निर्णय लिया?", o:["राज्य छोड़ने का","ऊँचे पर्वत से कूदकर आत्महत्या करने का","राजा से क्षमा माँगने का","युद्ध करने का"], a:1, e:"पशुतुल्य तिरस्कृत जीवन से दुःखी होकर उन्होंने ऊँचे पर्वत से कूदकर अपना जीवन समाप्त करने का निर्णय लिया।"},
      {q:"पर्वत की चोटी पर उन्हें कौन ध्यानस्थ मिला, जिसने उन्हें आत्महत्या से रोका?", o:["एक राजा","एक ध्यानस्थ मुनि","एक साधारण यात्री","कोई नहीं मिला"], a:1, e:"पर्वत की चोटी पर एक मुनि शांत मुद्रा में ध्यानस्थ मिले, जिनके दर्शन से उन्हें शांति मिली और वे उनके चरणों में गिर पड़े।"},
      {q:"मुनि ने आत्महत्या के बारे में क्या समझाया?", o:["आत्महत्या से केवल शरीर नष्ट होगा, दुःख का वास्तविक कारण कर्म नष्ट करने के लिए तप करो","आत्महत्या सही मार्ग है","राजा से बदला लो","धन कमाओ"], a:0, e:"मुनि ने कहा कि आत्महत्या से केवल पार्थिव शरीर नष्ट होगा, दुःख नहीं — दुःख के वास्तविक कारण अर्जित कर्मों को नष्ट करने हेतु तपश्चरण करना चाहिए।"},
      {q:"हस्तिनापुर में भिक्षार्थ गए संभूत मुनि को नमूची (अब मंत्री) ने पहचानकर क्या करवाया?", o:["सम्मान करवाया","सेवकों से पिटवाकर नगर से बाहर ढकेलवाया","भोजन दिलवाया","कुछ नहीं करवाया"], a:1, e:"भण्डाफोड़ के डर से नमूची ने अपने आदमियों से मुनि को नगर से बाहर ढकेलने और निर्दयतापूर्वक प्रहार करने का आदेश दिया।"},
      {q:"लगातार प्रहार से क्रुद्ध संभूत मुनि के मुख से क्या प्रकट हुई?", o:["जल की धारा","भीषण आग की लपटों वाली तेजोलेश्या","मंत्रोच्चार","कुछ नहीं"], a:1, e:"जब सेवकों ने प्रहार बंद नहीं किया तो मुनि क्रुद्ध हो गए और उनके मुख से भीषण आग उगलती तेजोलेश्या प्रकट हुई, जिससे आसमान लाल हो उठा।"},
      {q:"संभूत मुनि का क्रोध अंततः किसने शांत किया?", o:["राजा सनत्कुमार ने","उनके भाई चित्त मुनि ने","नमूची ने","जनता ने"], a:1, e:"नभमण्डल को अग्नि-ज्वालाओं से प्रदीप्त देखकर चित्त मुनि घटनास्थल पर पहुँचे और अपने भाई को शांत किया।"},
      {q:"चक्रवर्ती सनत्कुमार ने अपराधी नमूची को मुनियों के समक्ष प्रस्तुत करने पर मुनियों ने क्या निर्णय दिया?", o:["कठोर दंड देने का","उसे मुक्त कर दिया जाए","मृत्युदंड देने का","राज्य से निकाल देने का"], a:1, e:"मुनियों ने कहा कि नमूची को मुक्त कर दिया जाए, तत्पश्चात उसे हस्तिनापुर से बाहर निकाल दिया गया।"},
      {q:"वंदन के समय किसके बालों का स्पर्श संभूत मुनि के चरणों से हो गया, जो आगे चलकर निदान का कारण बना?", o:["सनत्कुमार की पट्टमहीषी सुनंदा के बालों का","चुलनी के बालों का","पुष्पवती के बालों का","रत्नवती के बालों का"], a:0, e:"मुनि संभूत के चरणों में वंदन करते समय स्त्री-रत्न सुनंदा के सुगंधित लम्बे बालों का स्पर्श उनके चरणों से हो गया।"},
      {q:"आयु पूर्ण कर दोनों मुनि-भाई किस विमान में देव बने?", o:["विजय अनुत्तरविमान में","सौधर्मकल्प के नलिनीगुल्म (पद्मगुल्म) विमान में","सर्वार्थसिद्धि विमान में","माहेन्द्र कल्प में"], a:1, e:"समाधिपूर्वक आयु पूर्ण कर दोनों मुनि सौधर्मकल्प के नलिनीगुल्म (पद्मगुल्म) नामक विमान में देव हुए।"},
      {q:"छठे भव में चित्त मुनि का जीव कहाँ जन्मा?", o:["पुरिमताल के श्रेष्ठी गणपुंज की पत्नी नंदा के गर्भ से","काम्पिल्यपुर में राजपुत्र के रूप में","हस्तिनापुर में","वाराणसी में"], a:0, e:"देवायु पूर्ण होने पर चित्त मुनि का जीव पुरिमताल के श्रेष्ठी गणपुंज की पत्नी नंदा के गर्भ से उत्पन्न हुआ।"},
      {q:"ब्रह्मदत्त (संभूत मुनि का जीव) छठे भव में सनत्कुमार-सुनंदा का ऐश्वर्य-लावण्य देखकर क्या 'निदान' कर बैठा?", o:["साधु बनने का","कि उसकी तपस्या का फल हो तो उसे भी वैसा ही चक्रवर्ती ऐश्वर्य मिले","धन कमाने का","राजा बनने से इंकार का"], a:1, e:"ब्रह्मदत्त ने बताया कि सनत्कुमार का ऐश्वर्य और सुनंदा आदि रानियों का लावण्य देखकर उसने निदान कर लिया था कि उसे भी वैसा ही सम्पूर्ण ऐश्वर्य प्राप्त हो, जिसके फलस्वरूप वह चक्रवर्ती बना।"},
      {q:"मुनि चित्त ने ब्रह्मदत्त को क्या उपदेश दिया?", o:["राज्य बढ़ाने का","संसार में केवल धर्म ही सार है, मुनिधर्म अंगीकार कर अंतरंग शत्रुओं को जीतने का","अधिक विवाह करने का","युद्ध जारी रखने का"], a:1, e:"मुनि चित्त ने कहा कि शरीर, सौंदर्य, धन-ऐश्वर्य सब क्षणभंगुर हैं; अब मुनिधर्म अंगीकार कर काम-क्रोधादि अंतरंग शत्रुओं को भी जीतकर मुक्ति का सुख प्राप्त करो।"},
      {q:"ब्रह्मदत्त ने मुनि चित्त की सीख पर क्या उत्तर दिया?", o:["तुरंत दीक्षा ले ली","भोगों के दलदल में इतना फँसा हूँ कि संयम ग्रहण करना मेरी सामर्थ्य से बाहर है","क्रोधित हो गया","कुछ नहीं कहा"], a:1, e:"ब्रह्मदत्त ने कहा कि कीचड़ में फँसे हाथी की तरह वह निदान से प्राप्त भोगों के दलदल में इतना फँसा है कि संयम ग्रहण करना उसकी सामर्थ्य के बाहर है।"},
      {q:"मुनि चित्त ने विहार करने से पहले ब्रह्मदत्त को क्या अंतिम सलाह दी?", o:["तुरंत राज्य त्यागने की","प्राणिमात्र से मैत्री और परोपकार के कार्यों में संलग्न रहने की","युद्ध टालने की","धन दान करने की"], a:1, e:"मुनि चित्त ने कहा कि पूर्ण त्याग न कर सको तो कम से कम प्राणिमात्र के साथ मैत्री का भाव रखो और परोपकार में संलग्न रहो, जिससे दिव्य सुख प्राप्त हो सके।"},
      {q:"मुनि चित्त ने अंततः क्या प्राप्त किया?", o:["चक्रवर्ती पद","कठोर तपस्या से कर्मों को भस्मसात् कर निर्वाण/मुक्ति","देवलोक का सुख","राज्य वापसी"], a:1, e:"अनेक वर्षों तक संयम-पालन और कठोर तपस्या से समस्त कर्मों को भस्मसात् कर मुनि चित्त शुद्ध-बुद्ध हो निर्वाण को प्राप्त हुए।"},
      {q:"यूनान नरेश से उपहार में मिले घोड़े पर सवार ब्रह्मदत्त कहाँ जा पहुँचा?", o:["एक विशाल जलाशय वाले घने जंगल में","सीधे शत्रु के राज्य में","समुद्र तट पर","किसी नगर में"], a:0, e:"घोड़े के वेग को न रोक पाने के कारण ब्रह्मदत्त अनेक नदी-नाले व वन लाँघते हुए एक घने जंगल में सरोवर के तट पर जा पहुँचा।"},
      {q:"वन में ब्रह्मदत्त ने किसे जार पुरुष के साथ देखकर दंडित किया?", o:["एक नागकन्या को","अपनी ही रानी को","एक विद्याधर कन्या को","किसी अनजान स्त्री को"], a:0, e:"ब्रह्मदत्त ने एक सुन्दर नागकन्या को जार पुरुष के साथ संभोग करते देखकर क्रोधित हो दोनों को चाबुक से पीटा।"},
      {q:"चोटिल नागकन्या ने अपने पति नागराज से ब्रह्मदत्त की क्या शिकायत की?", o:["कि ब्रह्मदत्त ने उसका पतिव्रत धर्म नष्ट करने की कोशिश की और मना करने पर चाबुक से पीटा","कि ब्रह्मदत्त ने उसे लूटा","कि ब्रह्मदत्त ने उसे बंदी बनाया","कोई शिकायत नहीं की"], a:0, e:"नागकन्या ने कहा कि ब्रह्मदत्त ने उसका पतिव्रत धर्म नष्ट करना चाहा, और मना करने पर चाबुक की मार से उसे अधमरा बना दिया।"},
      {q:"क्रोधित नागराज रात में ब्रह्मदत्त के शयनागार क्यों पहुँचा, पर क्या सुनकर विचार बदल दिया?", o:["उसे मारने का इरादा था, पर रानी को सच्ची घटना बताते सुनकर विचार बदल गया","कुछ नहीं, वह बात करने आया था","उसे केवल डराने आया था","उसने कुछ नहीं सुना"], a:0, e:"नागराज ब्रह्मदत्त को मारने आया था, पर रानी को असली घटना (नागकन्या के दुराचार को दंडित करना) सच्चाई से बताते सुनकर उसका क्रोध शांत हो गया और विचार बदल गए।"},
      {q:"प्रसन्न होकर नागराज ने ब्रह्मदत्त को कौन-सी विशेष विद्या प्रदान की?", o:["अदृश्य होने की विद्या","प्राणिमात्र की भाषा समझने की विद्या","उड़ने की विद्या","रोग-मुक्ति की विद्या"], a:1, e:"ब्रह्मदत्त की इच्छा पर नागराज ने उसे प्राणिमात्र की भाषा समझने की अदेय (दुर्लभ) विद्या प्रदान की।"},
      {q:"इस विद्या का कठोर नियम क्या था?", o:["इसे दिन में प्रयोग नहीं कर सकते","किसी प्राणी की बोली समझकर किसी अन्य के सामने प्रकट करने पर सिर के सात टुकड़े हो जाएंगे","इसे केवल रानी के सामने प्रयोग कर सकते हैं","कोई नियम नहीं था"], a:1, e:"नियम था कि किसी प्राणी की बोली समझकर यदि उसे किसी अन्य के सम्मुख प्रकट किया तो सिर के सात टुकड़े हो जाएंगे।"},
      {q:"घरोली (छिपकली) पक्षियों की बातचीत सुनकर ब्रह्मदत्त हँस क्यों पड़ा?", o:["वे गा रहे थे","गर्भवती मादा घरोली की विचित्र इच्छा (राजा का उबटन लाने) पर नर घरोली की मजाकिया आशंका सुनकर","वे झगड़ रहे थे","कोई कारण नहीं"], a:1, e:"गर्भवती मादा घरोली ने नर से राजा का अंगराग लाने को कहा; नर ने मजाक में कहा कि तुम मुझे मौत के मुँह में ढकेलना चाहती हो — यह सुनकर ब्रह्मदत्त हँस पड़ा।"},

/* ============ STATE ============ */
let state = {
  bookId:null,
  chapterId:null,
  qIndex:0,
  score:0,
  answered:false,
  currentOptions:null
};

/* ============ SOUND (voice) ============ */
let hindiVoice = null;
function loadHindiVoice(){
  const voices = window.speechSynthesis ? window.speechSynthesis.getVoices() : [];
  hindiVoice = voices.find(v => v.lang === 'hi-IN') ||
               voices.find(v => v.lang && v.lang.startsWith('hi')) ||
               null;
}
if(window.speechSynthesis){
  loadHindiVoice();
  window.speechSynthesis.onvoiceschanged = loadHindiVoice;
}
function speak(text){
  if(!window.speechSynthesis) return;
  window.speechSynthesis.cancel(); // stop any previous speech
  const utter = new SpeechSynthesisUtterance(text);
  utter.lang = 'hi-IN';
  if(hindiVoice) utter.voice = hindiVoice;
  utter.rate = 1;
  utter.pitch = 1;
  window.speechSynthesis.speak(utter);
}
function playCorrectSound(){
  speak('यह जवाब सही है');
}
function playWrongSound(){
  speak('यह जवाब गलत है');
}
function playResultSound(pct){
  if(pct >= 70){
    speak('बहुत बढ़िया! आपने बहुत अच्छा किया');
  } else if(pct >= 40){
    speak('अच्छा प्रयास, थोड़ा और अभ्यास करें');
  } else {
    speak('कोई बात नहीं, कथा फिर से पढ़कर दोबारा प्रयास करें');
  }
}

/* ============ ELEMENTS ============ */
const bookScreen = document.getElementById('book-screen');
const homeScreen = document.getElementById('home-screen');
const quizScreen = document.getElementById('quiz-screen');
const resultScreen = document.getElementById('result-screen');
const bookGrid = document.getElementById('book-grid');
const chapterGrid = document.getElementById('chapter-grid');

/* ============ RENDER BOOKS ============ */
function renderBooks(){
  bookGrid.innerHTML = '';
  books.forEach((bk)=>{
    const card = document.createElement('div');
    card.className = 'chapter-card';
    const chCount = bk.chapters.length;
    const qCount = bk.chapters.reduce((s,c)=>s+c.questions.length,0);
    card.innerHTML = `
      <div class="num">Book ${bk.id}</div>
      <h2>${bk.title}</h2>
      <p>${bk.subtitle}</p>
      <div class="chapter-meta">
        <span>${chCount ? chCount + ' अध्याय, ' + qCount + ' प्रश्न' : 'जल्द आएगा'}</span>
        <span class="go">${chCount ? 'खोलें →' : ''}</span>
      </div>
    `;
    card.addEventListener('click', ()=> selectBook(bk.id));
    bookGrid.appendChild(card);
  });
}

function selectBook(bookId){
  state.bookId = bookId;
  const bk = books.find(b=>b.id===bookId);
  bookScreen.classList.add('hidden');
  homeScreen.classList.remove('hidden');
  document.getElementById('book-title-heading').textContent = bk.title + ' — अध्याय';
  const footerNote = document.getElementById('home-footer-note');
  if(bk.chapters.length){
    footerNote.innerHTML = 'प्रत्येक अध्याय की कथा में दिए गए हर महत्वपूर्ण प्रसंग, नाम व घटना पर आधारित प्रश्न हैं।';
  } else {
    footerNote.innerHTML = '';
  }
  renderHome();
}

document.getElementById('back-to-books-btn').addEventListener('click', ()=>{
  homeScreen.classList.add('hidden');
  bookScreen.classList.remove('hidden');
});

/* ============ RENDER HOME (chapters within selected book) ============ */
function renderHome(){
  chapterGrid.innerHTML = '';
  const bk = books.find(b=>b.id===state.bookId);
  if(!bk.chapters.length){
    chapterGrid.innerHTML = '<div class="empty-book-msg">इस पुस्तक के अध्याय जल्द जोड़े जाएंगे।</div>';
    return;
  }
  bk.chapters.forEach((ch, idx)=>{
    const card = document.createElement('div');
    card.className = 'chapter-card';
    card.innerHTML = `
      <div class="num">अध्याय ${idx+1}</div>
      <h2>${ch.title}</h2>
      <p>${ch.desc}</p>
      <div class="chapter-meta">
        <span>${ch.questions.length} प्रश्न</span>
        <span class="go">आरंभ करें →</span>
      </div>
      <button class="listen-btn" type="button">🔊 प्रश्न-उत्तर सुनें</button>
      ${ch.partial ? '<div class="partial-tag">आंशिक अध्याय</div>' : ''}
    `;
    card.addEventListener('click', (e)=>{
      if(e.target.closest('.listen-btn')) return;
      startQuiz(ch.id);
    });
    card.querySelector('.listen-btn').addEventListener('click', (e)=>{
      e.stopPropagation();
      openListen(ch.id);
    });
    chapterGrid.appendChild(card);
  });
}

/* ============ QUIZ LOGIC ============ */
function startQuiz(chapterId){
  state = { bookId: state.bookId, chapterId, qIndex:0, score:0, answered:false };
  bookScreen.classList.add('hidden');
  homeScreen.classList.add('hidden');
  resultScreen.classList.add('hidden');
  quizScreen.classList.remove('hidden');
  renderQuestion();
}

function currentChapter(){
  const bk = books.find(b=>b.id===state.bookId);
  return bk.chapters.find(c=>c.id===state.chapterId);
}


function shuffleOptions(q){
  const optsWithFlag = q.o.map((text, i)=>({ text, correct: i === q.a }));
  for(let i = optsWithFlag.length - 1; i > 0; i--){
    const j = Math.floor(Math.random() * (i + 1));
    [optsWithFlag[i], optsWithFlag[j]] = [optsWithFlag[j], optsWithFlag[i]];
  }
  return optsWithFlag;
}

function renderQuestion(){
  const ch = currentChapter();
  const total = ch.questions.length;
  const q = ch.questions[state.qIndex];
  state.answered = false;

  document.getElementById('quiz-chapter-title').textContent = ch.title;
  document.getElementById('quiz-progress-text').textContent = `प्रश्न ${state.qIndex+1} / ${total}`;
  document.getElementById('score-pill').textContent = `स्कोर: ${state.score}`;
  document.getElementById('progress-fill').style.width = `${(state.qIndex/total)*100}%`;
  document.getElementById('question-text').textContent = q.q;

  const shuffled = shuffleOptions(q);
  state.currentOptions = shuffled;

  const holder = document.getElementById('options-holder');
  holder.innerHTML = '';
  shuffled.forEach((opt, i)=>{
    const btn = document.createElement('div');
    btn.className = 'option';
    btn.textContent = opt.text;
    btn.addEventListener('click', ()=> selectOption(i, btn));
    holder.appendChild(btn);
  });

  const explainBox = document.getElementById('explain-box');
  explainBox.classList.remove('show');
  explainBox.textContent = '';

  const nextBtn = document.getElementById('next-btn');
  nextBtn.classList.remove('show');
  nextBtn.textContent = (state.qIndex === total-1) ? 'परिणाम देखें →' : 'अगला प्रश्न →';
}

function selectOption(i, btnEl){
  if(state.answered) return;
  state.answered = true;

  const shuffled = state.currentOptions;
  const q = currentChapter().questions[state.qIndex];
  const allOptions = document.querySelectorAll('#options-holder .option');
  const correctIndex = shuffled.findIndex(o => o.correct);

  allOptions.forEach((el, idx)=>{
    el.classList.add('disabled');
    if(idx === correctIndex) el.classList.add('correct');
    else if(idx === i && i !== correctIndex) el.classList.add('wrong');
  });

  if(i === correctIndex){
    state.score++;
    playCorrectSound();
  } else {
    playWrongSound();
  }

  document.getElementById('score-pill').textContent = `स्कोर: ${state.score}`;

  const explainBox = document.getElementById('explain-box');
  explainBox.textContent = q.e;
  explainBox.classList.add('show');

  document.getElementById('next-btn').classList.add('show');
}

document.getElementById('next-btn').addEventListener('click', ()=>{
  const ch = currentChapter();
  if(state.qIndex < ch.questions.length - 1){
    state.qIndex++;
    renderQuestion();
  } else {
    showResult();
  }
});

document.getElementById('back-btn').addEventListener('click', ()=>{
  quizScreen.classList.add('hidden');
  resultScreen.classList.add('hidden');
  homeScreen.classList.remove('hidden');
});

document.getElementById('home-btn').addEventListener('click', ()=>{
  resultScreen.classList.add('hidden');
  homeScreen.classList.remove('hidden');
});

document.getElementById('retry-btn').addEventListener('click', ()=>{
  startQuiz(state.chapterId);
});

/* ============ RESULT + LOTUS ============ */
function showResult(){
  const ch = currentChapter();
  const total = ch.questions.length;
  const pct = Math.round((state.score/total)*100);

  quizScreen.classList.add('hidden');
  resultScreen.classList.remove('hidden');

  document.getElementById('result-score').textContent = `${ch.title} — ${state.score} / ${total} सही (${pct}%)`;

  let title, msg;
  if(pct >= 90){ title = "सम्यक्त्व में सुदृढ़!"; msg = "अद्भुत! आपने कथा के हर प्रसंग को गहराई से आत्मसात किया है।"; }
  else if(pct >= 70){ title = "श्रद्धा सुदृढ़ हो रही है"; msg = "बहुत अच्छा प्रयास — कुछ प्रसंगों को दोबारा पढ़ें और स्मरण पक्का करें।"; }
  else if(pct >= 40){ title = "यात्रा जारी है"; msg = "अच्छी शुरुआत! कथा को एक बार फिर पढ़कर पुनः प्रयास करें।"; }
  else { title = "पुनः अध्ययन आवश्यक"; msg = "कोई बात नहीं — कथा को ध्यान से पढ़ें और फिर से प्रयास करें, हर पाठ एक नया निमित्त है।"; }

  document.getElementById('result-title').textContent = title;
  document.getElementById('result-msg').textContent = msg;

  drawLotus(pct);
  playResultSound(pct);
}

function drawLotus(pct){
  const group = document.getElementById('petal-group');
  group.innerHTML = '';
  const petalCount = 8;
  const filled = Math.max(1, Math.round((pct/100)*petalCount));
  const cx = 50, cy = 50, rInner = 12, rOuter = 42;

  for(let i=0;i<petalCount;i++){
    const angle = (i/petalCount) * 2 * Math.PI - Math.PI/2;
    const nextAngle = angle + (2*Math.PI/petalCount);
    const midAngle = (angle+nextAngle)/2;

    const tipX = cx + rOuter*Math.cos(midAngle);
    const tipY = cy + rOuter*Math.sin(midAngle);
    const baseX1 = cx + rInner*Math.cos(angle);
    const baseY1 = cy + rInner*Math.sin(angle);
    const baseX2 = cx + rInner*Math.cos(nextAngle);
    const baseY2 = cy + rInner*Math.sin(nextAngle);

    const path = document.createElementNS("http://www.w3.org/2000/svg","path");
    const d = `M ${baseX1} ${baseY1} Q ${tipX} ${tipY} ${baseX2} ${baseY2} Q ${cx} ${cy} ${baseX1} ${baseY1} Z`;
    path.setAttribute('d', d);
    path.setAttribute('class','petal');
    path.setAttribute('fill', i < filled ? '#a4392f' : 'rgba(122,31,43,0.12)');
    path.setAttribute('stroke', i < filled ? '#7a1f2b' : 'rgba(122,31,43,0.25)');
    path.setAttribute('stroke-width','0.6');
    group.appendChild(path);
  }
}

/* ============ LISTEN (सुनें) MODE ============ */
const listenScreen = document.getElementById('listen-screen');
const lcPlayBtn    = document.getElementById('lc-play');
const lcStatusEl   = document.getElementById('lc-status');
const qaListEl     = document.getElementById('qa-list');

let listen = { chapterId:null, index:0, playing:false, items:[], _resume:null };
let listenUtter = null;
let speechToken = 0;
let listenRate = 1;
const RATE_STEPS = [0.75, 1, 1.25, 1.5];

function lcStatus(msg){ lcStatusEl.textContent = msg; }

function updatePlayBtn(){
  lcPlayBtn.textContent = listen.playing ? '⏸ रोकें' : '▶ सुनें';
}

function stopSpeech(){
  speechToken++;
  listen._resume = null;
  if(!window.speechSynthesis) return;
  if(listenUtter){ listenUtter.onend = null; listenUtter.onerror = null; }
  listenUtter = null;
  window.speechSynthesis.cancel();
}

function openListen(chapterId){
  stopSpeech();
  const bk = books.find(b=>b.id===state.bookId);
  if(!bk) return;
  const ch = bk.chapters.find(c=>c.id===chapterId);
  if(!ch) return;

  listen.chapterId = chapterId;
  listen.items = ch.questions;
  listen.index = 0;
  listen.playing = false;

  bookScreen.classList.add('hidden');
  homeScreen.classList.add('hidden');
  quizScreen.classList.add('hidden');
  resultScreen.classList.add('hidden');
  listenScreen.classList.remove('hidden');

  document.getElementById('listen-chapter-title').textContent = ch.title;
  document.getElementById('listen-count-text').textContent = 'कुल ' + ch.questions.length + ' प्रश्न-उत्तर';

  renderQAList();
  updatePlayBtn();
  if(window.speechSynthesis){
    lcStatus('सुनने के लिए ▶ दबाएँ');
  } else {
    lcStatus('इस डिवाइस में वाणी सुविधा उपलब्ध नहीं है — प्रश्नोत्तर नीचे पढ़ सकते हैं');
  }
  window.scrollTo({ top:0, behavior:'smooth' });
}

function closeListen(){
  stopSpeech();
  listen.playing = false;
  listenScreen.classList.add('hidden');
  homeScreen.classList.remove('hidden');
}

function renderQAList(){
  qaListEl.innerHTML = '';
  listen.items.forEach((q, i)=>{
    const div = document.createElement('div');
    div.className = 'qa-item' + (i === listen.index ? ' active' : '');
    div.innerHTML = `
      <div class="qa-num">प्रश्न ${i+1}</div>
      <div class="qa-q">${q.q}</div>
      <div class="qa-a">उत्तर: ${q.o[q.a]}</div>
      ${q.e ? `<div class="qa-e">${q.e}</div>` : ''}
    `;
    div.addEventListener('click', ()=> playFrom(i));
    qaListEl.appendChild(div);
  });
}

function highlightQA(i, scroll){
  const items = qaListEl.querySelectorAll('.qa-item');
  items.forEach((el, idx)=> el.classList.toggle('active', idx === i));
  if(scroll && items[i]) items[i].scrollIntoView({ behavior:'smooth', block:'center' });
}

/* लंबे वाक्य को छोटे टुकड़ों में बाँटें — इससे ब्राउज़र वाणी बीच में नहीं टूटती */
function splitForSpeech(text, maxLen){
  maxLen = maxLen || 130;
  const words = text.split(/\s+/).filter(Boolean);
  const chunks = [];
  let cur = '';
  words.forEach(w=>{
    if(cur && (cur + ' ' + w).length > maxLen){
      chunks.push(cur);
      cur = w;
    } else {
      cur = cur ? (cur + ' ' + w) : w;
    }
    if(/[।?!]$/.test(w) && cur.length >= 30){
      chunks.push(cur);
      cur = '';
    }
  });
  if(cur) chunks.push(cur);
  return chunks.length ? chunks : [text];
}

function speakQA(i, onDone){
  if(!window.speechSynthesis) return;
  const q = listen.items[i];
  const chunks = splitForSpeech('प्रश्न ' + (i+1) + '. ' + q.q + ' उत्तर. ' + q.o[q.a]);

  speechToken++;
  const myToken = speechToken;
  window.speechSynthesis.cancel();

  let ci = 0;
  const speakNext = ()=>{
    if(myToken !== speechToken || !listen.playing) return;
    if(ci >= chunks.length){ listen._resume = null; onDone(); return; }
    const u = new SpeechSynthesisUtterance(chunks[ci++]);
    u.lang = 'hi-IN';
    if(hindiVoice) u.voice = hindiVoice;
    u.rate = listenRate;
    u.pitch = 1;
    u.onend   = ()=> speakNext();
    u.onerror = ()=> speakNext();
    listenUtter = u;
    window.speechSynthesis.speak(u);
  };
  listen._resume = speakNext;
  speakNext();
}

function playFrom(i){
  if(!window.speechSynthesis){
    lcStatus('इस डिवाइस में वाणी सुविधा उपलब्ध नहीं है');
    return;
  }
  if(i < 0 || i >= listen.items.length) return;

  listen.index = i;
  listen.playing = true;
  updatePlayBtn();
  highlightQA(i, true);
  lcStatus('चल रहा है — ' + (i+1) + ' / ' + listen.items.length);

  speakQA(i, ()=>{
    if(listen.index + 1 < listen.items.length){
      playFrom(listen.index + 1);
    } else {
      listen.playing = false;
      updatePlayBtn();
      lcStatus('समाप्त — सभी ' + listen.items.length + ' प्रश्न-उत्तर सुन लिए');
    }
  });
}

function toggleListenPlay(){
  if(!window.speechSynthesis){
    lcStatus('इस डिवाइस में वाणी सुविधा उपलब्ध नहीं है');
    return;
  }
  if(listen.playing){
    listen.playing = false;
    stopSpeech();
    updatePlayBtn();
    lcStatus('रुका हुआ — प्रश्न ' + (listen.index+1) + ' / ' + listen.items.length);
  } else {
    playFrom(listen.index);
  }
}

function jumpListen(delta){
  const ni = listen.index + delta;
  if(ni < 0 || ni >= listen.items.length) return;
  if(listen.playing){
    playFrom(ni);
  } else {
    listen.index = ni;
    highlightQA(ni, true);
    lcStatus('प्रश्न ' + (ni+1) + ' / ' + listen.items.length + ' — ▶ दबाएँ');
  }
}

function stopListenAll(){
  listen.playing = false;
  stopSpeech();
  listen.index = 0;
  highlightQA(0, true);
  updatePlayBtn();
  lcStatus('रोक दिया गया — शुरू से सुनने के लिए ▶ दबाएँ');
}

lcPlayBtn.addEventListener('click', toggleListenPlay);
document.getElementById('lc-prev').addEventListener('click', ()=> jumpListen(-1));
document.getElementById('lc-next').addEventListener('click', ()=> jumpListen(1));
document.getElementById('lc-stop').addEventListener('click', stopListenAll);
document.getElementById('lc-rate').addEventListener('click', ()=>{
  const ni = (RATE_STEPS.indexOf(listenRate) + 1) % RATE_STEPS.length;
  listenRate = RATE_STEPS[ni];
  document.getElementById('lc-rate').textContent = listenRate + 'x';
  if(listen.playing) playFrom(listen.index);   // नई गति तुरंत लागू करें
});
document.getElementById('listen-back-btn').addEventListener('click', closeListen);

/* watchdog: अगर वाणी बीच में चुपचाप रुक जाए तो उसी जगह से आगे बढ़ाएँ */
let listenStall = 0;
setInterval(()=>{
  if(!listen.playing || !window.speechSynthesis){ listenStall = 0; return; }
  const ss = window.speechSynthesis;
  if(ss.speaking || ss.pending){ listenStall = 0; return; }
  listenStall++;
  if(listenStall >= 2){
    listenStall = 0;
    if(typeof listen._resume === 'function') listen._resume();
  }
}, 1200);

/* ऐप बैकग्राउंड में जाए तो वाणी बंद करें */
document.addEventListener('visibilitychange', ()=>{
  if(document.hidden && listen.playing){
    listen.playing = false;
    stopSpeech();
    updatePlayBtn();
    lcStatus('रुका हुआ — प्रश्न ' + (listen.index+1) + ' / ' + listen.items.length);
  }
});

/* ============ PWA: install + service worker ============ */
(function(){
  var installBtn = document.getElementById('install-btn');
  var deferred = null;

  // standalone mein already chal raha hai to button mat dikhao
  var standalone = window.matchMedia('(display-mode: standalone)').matches
                || window.navigator.standalone === true;

  window.addEventListener('beforeinstallprompt', function(e){
    e.preventDefault();
    deferred = e;
    if(!standalone && installBtn) installBtn.classList.add('show');
  });

  if(installBtn){
    installBtn.addEventListener('click', function(){
      if(deferred){
        deferred.prompt();
        deferred.userChoice.then(function(){
          deferred = null;
          installBtn.classList.remove('show');
        });
      } else {
        alert('इंस्टॉल करने के लिए:\n\nChrome (Android): मेन्यू ⋮ → "ऐप इंस्टॉल करें" / "होम स्क्रीन में जोड़ें"\n\nSafari (iPhone): शेयर ⬆ → "Add to Home Screen"');
      }
    });
  }

  window.addEventListener('appinstalled', function(){
    deferred = null;
    if(installBtn) installBtn.classList.remove('show');
  });

  // iOS pe beforeinstallprompt nahi chalta — wahan bhi button dikhao
  var isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) && !window.MSStream;
  if(isIOS && !standalone && installBtn) installBtn.classList.add('show');

  if('serviceWorker' in navigator){
    window.addEventListener('load', function(){
      navigator.serviceWorker.register('./sw.js').catch(function(err){
        console.log('SW register failed:', err);
      });
    });
  }
})();

/* ============ INIT ============ */
renderBooks();
</script>
